[package]
name = "cjson"
version = "0.1.0"
edition = "2024"

[dependencies]
arrayvec = { version = "0.7.6", default-features = false }
itoa = { version = "1.0.15", optional = true }
polonius-the-crab = "0.4.2"
ref-cast = "1.0.25"
ryu = "1.0.20"
const-itoa = { version = "0.1.0" }
const-ryu = { version = "0.1.0" }
cjson-proc-macro = { version = "0.1.0", path = "../cjson-proc-macro", optional = true }
either = { version = "1.15.0", default-features = false, optional = true }

[features]
default = ["std", "default_no_std"]
default_no_std = ["itoa", "proc-macro"]

# Enable all features for rust stable channel including `std`
stable_all = ["std", "stable_all_no_std"]
# Enable all features for rust stable channel excluding `std`
stable_all_no_std = ["default_no_std", "proc-macro", "either"]

alloc = []
std = ["alloc"]

# # Default Enabled Features
#
itoa = ["dep:itoa"]

proc-macro = ["dep:cjson-proc-macro"]
either = ["dep:either"]

# # Features for nightly rust
# This enables #[feature = "write_all_vectored"]
write_all_vectored = []
